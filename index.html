<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MICE</title>
<meta name="theme-color" content="#0E1318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MICE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: the hold pad and live timeline on the left; cue and session settings on the right. One column on narrow screens. */
:root{
  --bg:#EDF0F3;
  --surface:#FFFFFF;
  --ink:#16202A;
  --muted:#596574;
  --line:#D2D8E0;
  --cue:#B5650F;
  --cue-soft:#F7E6CF;
  --on-cue:#FFFFFF;
  --voice:#1E6CB0;
  --voice-dim:#BAC6D3;
  --warn:#8F5300;
  --warn-soft:#FBEAD0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1318;--surface:#161D25;--ink:#E4E9EF;--muted:#9AA5B4;--line:#2A333E;
    --cue:#E79B3E;--cue-soft:#3A2913;--on-cue:#1B1006;--voice:#5BA3E8;--voice-dim:#34424F;
    --warn:#E8AE55;--warn-soft:#33260F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{-webkit-user-select:auto;user-select:auto}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding:16px clamp(16px,3vw,32px) 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:grid;gap:2px}
.eyebrow{margin:0;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cue);font-weight:650}
h1{margin:0;font-size:2.1rem;line-height:1.1;letter-spacing:-.01em}
h2{margin:0;font-size:1rem;font-weight:650}
.lede{margin:.35rem 0 0;color:var(--muted);max-width:74ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.86rem}
:focus-visible{outline:3px solid var(--voice);outline-offset:2px}

.pad{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:clamp(150px,26vh,230px);border:2px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:background-color .06s,border-color .06s}
.pad *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad .big{font-size:2rem;font-weight:700;letter-spacing:.02em}
.pad .hint{font-size:.9rem;color:var(--muted)}
.pad.on{background:var(--cue);border-color:var(--cue);color:var(--on-cue)}
.pad.on .hint{color:var(--on-cue)}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.badge.rec{background:var(--warn-soft);color:var(--warn)}
.badge.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
canvas{display:block;width:100%;height:190px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0}
.stat{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--bg);min-width:0}
.stat dt{font-size:.74rem;color:var(--muted);letter-spacing:.02em}
.stat dd{margin:0;font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat dd.sub{font-family:var(--sans);font-size:.76rem;color:var(--muted);font-weight:400}

label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
select,input[type="text"]{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:38px;padding:.3em .55em;width:100%}
input[type="range"]{width:100%;accent-color:var(--cue)}
.check{display:flex;align-items:flex-start;gap:8px;font-size:.9rem}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--cue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.val{font-family:var(--mono);font-weight:500;color:var(--ink)}
.lab{display:flex;justify-content:space-between;gap:8px}

.btn{font:inherit;font-weight:600;font-size:.92rem;min-height:40px;padding:.45em 1em;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.stop{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.status{margin:0;font-size:.88rem;min-height:1.3em}
.status.warn{color:var(--warn)}
.note{margin:0;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:.86rem}
ul.files{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.86rem}
code{font-family:var(--mono);font-size:.85em}
@media (pointer:coarse){.pad{height:80vh;height:80dvh}}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--muted)}
details.fold[open]>summary::after{content:"\2212"}
details.fold[open]>summary{margin-bottom:12px}
.ver{font-size:.74rem;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:-12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ver" id="ver">MICE v13</div>
  <div class="grid">
    <div class="col">
      <button id="pad" class="pad" type="button" aria-pressed="false" aria-label="Hold to play the cue">
        <span class="big">Hold</span>
        <span class="hint" id="padHint">Mouse, touch or space bar</span>
      </button>

      <section class="panel" aria-labelledby="tlTitle">
        <div class="row between">
          <h2 id="tlTitle">Last 8 seconds</h2>
          <span class="badge" id="recBadge">Mic off</span>
        </div>
        <canvas id="tl" role="img" aria-label="Cue presses and detected voice over the last 8 seconds"></canvas>
        <div class="legend">
          <span><i style="background:var(--cue)"></i>Cue held</span>
          <span><i style="background:var(--voice)"></i>Voice detected</span>
          <span><i style="background:var(--voice-dim)"></i>Other sound</span>
        </div>
      </section>

    </div>

    <div class="col">
      <details class="panel fold" id="sesFold">
        <summary><h2 id="sesTitle">Session</h2></summary>
        <div class="row">
          <button class="btn primary" id="sesBtn" type="button">Start listening</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="small muted" id="bleedMsg" style="margin:0"></p>
        <p class="note" id="envNote" hidden></p>
        <label class="f">Microphone<select id="micSel"><option value="">Default microphone</option></select></label>
      </details>

      <details class="panel fold" id="cueFold">
        <summary><h2 id="cueTitle">Cue sound</h2></summary>
        <div class="two">
          <label class="f">Sound<select id="timbre"></select></label>
          <label class="f">Note<select id="note"></select></label>
        </div>
        <div class="row">
          <button class="btn" id="matchBtn" type="button">Match my voice</button>
          <span class="small muted" id="matchMsg">Sets the note to your speaking pitch.</span>
        </div>
        <label class="f"><span class="lab">Volume <span class="val" id="volVal"></span></span><input type="range" id="vol" min="0" max="100" step="1"></label>
        <label class="f"><span class="lab">Fade after release <span class="val" id="relVal"></span></span><input type="range" id="rel" min="30" max="400" step="10"></label>
        <label class="f">Hold key<select id="trigger">
          <option value="space">Space bar</option>
          <option value="lctrl">Left Ctrl</option>
          <option value="lshift">Left Shift</option>
          <option value="any">Any key (foot pedals and clickers)</option>
        </select></label>
        <label class="check"><input type="checkbox" id="mute"> <span>Mute the cue. Presses are still logged, for comparison runs.</span></label>
      </details>

    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------------- settings ----------------
const store = {
  get(k, d) { try { const v = localStorage.getItem('mice.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mice.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};
const NOTE_LO = 40, NOTE_HI = 69; // E2 to A4
const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const noteName = (m) => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const TIMBRES = [['piano', 'Soft piano'], ['epiano', 'Electric piano'], ['organ', 'Warm organ'], ['hum', 'Hum (voice-like)'], ['dynamic', 'Dynamic voice (adapts to you)']];
const S = {
  timbre: store.get('timbre', 'piano'),
  note: Math.min(NOTE_HI, Math.max(NOTE_LO, store.get('note', 52))),
  volume: store.get('volume', 0.55),
  release: store.get('release', 120),
  muted: store.get('muted', false),
  trigger: store.get('trigger', 'space'),
  mic: store.get('mic', ''),
  sens: 12,
};

function fill(sel, items, value) {
  sel.textContent = '';
  items.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; sel.appendChild(o); });
  sel.value = value;
}
fill($('timbre'), TIMBRES, S.timbre);
const noteItems = [];
for (let m = NOTE_LO; m <= NOTE_HI; m++) noteItems.push([String(m), noteName(m) + '  ·  ' + Math.round(hz(m)) + ' Hz']);
fill($('note'), noteItems, String(S.note));
$('trigger').value = S.trigger;
$('mute').checked = S.muted;

$('vol').value = String(Math.round(S.volume * 100));
$('rel').value = String(S.release);
function showVals() {
  $('volVal').textContent = Math.round(S.volume * 100) + '%';
  $('relVal').textContent = S.release + ' ms';
  $('padHint').textContent = 'Mouse, touch or ' + ({ space: 'space bar', lctrl: 'left Ctrl', lshift: 'left Shift' }[S.trigger] || 'any key');
}
showVals();
function showMatch() {
  const t = S.timbre === 'dynamic' ? tuneFor() : null;
  $('matchMsg').textContent = t ? 'Dynamic voice is tuned to you: about ' + Math.round(t.center) + ' Hz, ' + t.rate.toFixed(1) + ' syllables a second.' : 'Sets the note to your speaking pitch.';
}

function setSetting(key, value) {
  S[key] = value; store.set(key, value); showVals(); applyOut(); if (key === 'timbre') showMatch();
}
$('timbre').addEventListener('change', (e) => setSetting('timbre', e.target.value));
$('note').addEventListener('change', (e) => setSetting('note', +e.target.value));
$('vol').addEventListener('input', (e) => setSetting('volume', +e.target.value / 100));
$('rel').addEventListener('input', (e) => setSetting('release', +e.target.value));
$('trigger').addEventListener('change', (e) => setSetting('trigger', e.target.value));
$('mute').addEventListener('change', (e) => setSetting('muted', e.target.checked));
$('micSel').addEventListener('change', (e) => { S.mic = e.target.value; store.set('mic', S.mic); });
['timbre', 'note', 'trigger', 'micSel'].forEach((id) => $(id).addEventListener('change', (e) => e.target.blur()));

// ---------------- audio engine ----------------
let ctx = null, out = null, cueBus = null, markBus = null, gateSrc = null, noiseBuf = null, longNoise = null;
const waves = {};
function audio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: 'interactive' });
    out = ctx.createGain(); out.gain.value = S.muted ? 0 : S.volume; out.connect(ctx.destination);
    cueBus = ctx.createGain(); cueBus.gain.value = 1; cueBus.connect(out);
    markBus = ctx.createGain(); markBus.gain.value = 1; // timing gate, recorded but never played
    gateSrc = ctx.createConstantSource(); gateSrc.offset.value = 0; gateSrc.connect(markBus); gateSrc.start();
    noiseBuf = ctx.createBuffer(1, Math.round(ctx.sampleRate * 0.06), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    longNoise = ctx.createBuffer(1, Math.round(ctx.sampleRate * 3), ctx.sampleRate);
    { const d2 = longNoise.getChannelData(0); for (let i = 0; i < d2.length; i++) d2[i] = Math.random() * 2 - 1; }
    waves.bright = makeWave((n) => 1 / Math.pow(n, 1.15), 14);
    waves.mellow = makeWave((n) => 1 / Math.pow(n, 2.1), 8);
    waves.organ = makeWave((n) => [0, 1, 0.55, 0.28, 0.14, 0.07][n] || 0, 5);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function makeWave(fn, N) {
  const re = new Float32Array(N + 1), im = new Float32Array(N + 1);
  for (let n = 1; n <= N; n++) im[n] = fn(n);
  return ctx.createPeriodicWave(re, im);
}
function applyOut() {
  if (!out) return;
  out.gain.setTargetAtTime(S.muted ? 0 : S.volume, ctx.currentTime, 0.015);
}
const LEVEL = { piano: 0.5, epiano: 0.42, organ: 0.3, hum: 0.55, dynamic: 1.6 };

// Start one cue at context time t. The cue sustains until stopCue.
function startCue(t) {
  const c = ctx, f0 = hz(S.note), kind = S.timbre, L = LEVEL[kind] || 0.4;
  const amp = c.createGain(); amp.gain.value = 0;
  const rel = c.createGain(); rel.gain.value = 1;
  amp.connect(rel); rel.connect(cueBus);
  const srcs = [];
  const osc = (type, f, det) => { const o = c.createOscillator(); if (typeof type === 'string') o.type = type; else o.setPeriodicWave(type); o.frequency.value = f; if (det) o.detune.value = det; srcs.push(o); return o; };
  if (kind === 'piano') {
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.4;
    lp.frequency.setValueAtTime(Math.min(5200, f0 * 22), t);
    lp.frequency.setTargetAtTime(Math.min(1900, f0 * 9), t + 0.01, 0.35);
    lp.connect(amp);
    const gB = c.createGain(), gM = c.createGain();
    gB.gain.setValueAtTime(0, t); gB.gain.linearRampToValueAtTime(0.7, t + 0.004); gB.gain.setTargetAtTime(0, t + 0.004, 0.32);
    gM.gain.setValueAtTime(0, t); gM.gain.linearRampToValueAtTime(0.6, t + 0.006); gM.gain.setTargetAtTime(0.42, t + 0.006, 0.8);
    gB.connect(lp); gM.connect(lp);
    osc(waves.bright, f0, -1.3).connect(gB);
    osc(waves.bright, f0, 1.3).connect(gB);
    osc(waves.mellow, f0, 0.4).connect(gM);
    const nz = c.createBufferSource(); nz.buffer = noiseBuf; srcs.push(nz);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = Math.min(2600, Math.max(700, f0 * 7)); bp.Q.value = 0.9;
    const gn = c.createGain(); gn.gain.setValueAtTime(0.08, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + 0.03);
    nz.connect(bp); bp.connect(gn); gn.connect(amp);
    amp.gain.setValueAtTime(L, t);
  } else if (kind === 'epiano') {
    const car = osc('sine', f0), mod = osc('sine', f0), sub = osc('sine', f0);
    const mg = c.createGain(); mg.gain.setValueAtTime(f0 * 2.4, t); mg.gain.setTargetAtTime(f0 * 0.3, t, 0.45);
    mod.connect(mg); mg.connect(car.frequency);
    const sg = c.createGain(); sg.gain.value = 0.35; sub.connect(sg);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.min(3000, f0 * 14); lp.Q.value = 0.3;
    car.connect(lp); sg.connect(lp); lp.connect(amp);
    amp.gain.setValueAtTime(0, t); amp.gain.linearRampToValueAtTime(L, t + 0.003); amp.gain.setTargetAtTime(L * 0.55, t + 0.003, 0.7);
  } else if (kind === 'organ') {
    const g2 = c.createGain(); g2.gain.value = 0.5;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.min(2400, f0 * 10);
    osc(waves.organ, f0).connect(lp);
    osc(waves.organ, f0, 4).connect(g2); g2.connect(lp);
    lp.connect(amp);
    amp.gain.setValueAtTime(0, t); amp.gain.linearRampToValueAtTime(L, t + 0.015);
  } else if (kind === 'dynamic') {
    return dynamicCue(c, t, f0, L, amp, rel, srcs, tuneFor());
  } else {
    const o = osc('sawtooth', f0), vib = osc('sine', 5.2);
    const vg = c.createGain(); vg.gain.value = f0 * 0.004; vib.connect(vg); vg.connect(o.frequency);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.7;
    const f1 = c.createBiquadFilter(); f1.type = 'peaking'; f1.frequency.value = 450; f1.Q.value = 2; f1.gain.value = 8;
    o.connect(lp); lp.connect(f1); f1.connect(amp);
    amp.gain.setValueAtTime(0, t); amp.gain.linearRampToValueAtTime(L, t + 0.03);
  }
  srcs.forEach((s) => s.start(t));
  return { rel, srcs };
}
// "Dynamic voice": a soft, wordless, babbling voice (in the spirit of the Sims' speech) that adapts to you.
// Source: a glottal-like wave with slow pitch wobble (jitter), loudness wobble (shimmer) and a little breath noise,
// run through three formant filters. It speaks in phrases of several syllables. Each syllable starts with a short,
// soft consonant-like gesture (nasal, glide or a light stop) and then settles on a vowel, with everything moving on
// eased curves. It never goes silent, so it stays a continuous sound to lock onto, and the first syllable starts at once.
// After about 5.5 s of your speech (learn / tuneFor) it follows your voice: centre pitch and range, speed, phrase
// length, the pitch and loudness shape of your phrases, and your own vowels.
// Vowels measured from real speakers: Hillenbrand, Getty, Clark & Wheeler (1995), 12 American English vowels from 45 men,
// 48 women and 46 children (data hosted with permission at github.com/santiagobarreda/hillenbrand_et_al_1995, MIT licence).
// The numbers below are the men's means (Hz) of F1, F2, F3 at 20% (on) and 80% (off) of the vowel, which is where each vowel's
// own spectral glide comes from, and the mean duration d (ms). w is how often I let each vowel occur: reduced vowels (uh, ih, eh)
// dominate, as in English running speech; the weights are my own estimates, not from that dataset.
const VOWEL_DB = [
  { n: 'uh', w: 0.26, d: 194, on: [622, 1181, 2548], off: [574, 1493, 2550] },
  { n: 'ih', w: 0.16, d: 193, on: [434, 2032, 2683], off: [466, 1841, 2662] },
  { n: 'eh', w: 0.09, d: 196, on: [584, 1817, 2603], off: [561, 1745, 2645] },
  { n: 'er', w: 0.07, d: 263, on: [485, 1371, 1720], off: [442, 1484, 1752] },
  { n: 'ae', w: 0.07, d: 272, on: [592, 1923, 2597], off: [632, 1720, 2598] },
  { n: 'ah', w: 0.06, d: 261, on: [754, 1304, 2528], off: [706, 1461, 2537] },
  { n: 'iy', w: 0.07, d: 244, on: [346, 2312, 3010], off: [343, 2317, 2947] },
  { n: 'ei', w: 0.05, d: 267, on: [479, 2089, 2699], off: [400, 2229, 2742] },
  { n: 'oa', w: 0.05, d: 266, on: [511, 936, 2455], off: [435, 898, 2448] },
  { n: 'uw', w: 0.04, d: 237, on: [385, 1015, 2346], off: [368, 1028, 2338] },
  { n: 'oo', w: 0.04, d: 193, on: [468, 1122, 2440], off: [483, 1490, 2445] },
  { n: 'aw', w: 0.04, d: 275, on: [654, 1020, 2516], off: [658, 1265, 2492] },
];
// Across all 139 speakers, formants rise with pitch as (f0 / 130) ^ 0.31 / 0.33 / 0.27 for F1 / F2 / F3 (r = 0.82 to 0.87), because
// higher voices have shorter vocal tracts. Relative to the men's means above.
const FORM_EXP = [0.312, 0.327, 0.274];
const VDB_MEAN = [0, 1, 2].map((k) => VOWEL_DB.reduce((a, v) => a + v.w * (v.on[k] + v.off[k]) / 2, 0));
// Vocal-tract scale for F1..F3: from the user's pitch, nudged toward what was measured on the user's own speech (when known).
function formantScale(center, meas) {
  return [0, 1, 2].map((k) => {
    const law = Math.pow(center / 130, FORM_EXP[k]);
    const m = meas ? meas[k] / VDB_MEAN[k] : law;
    return Math.max(0.85, Math.min(1.45, Math.sqrt(law * Math.max(0.7, Math.min(1.6, m)))));

// ---------------- start and stop ----------------
let busy = false, session = null;   // session: { cap } while listening

// A short soft hiss through the headphones: broadband, so the cue-to-microphone path can be learned at all pitches.

// Solve A x = b for a symmetric positive-definite A (row-major, n x n) by Cholesky.

// One bleed measurement, while the user stays quiet: a hiss gives the path delay (cross-correlation),

  const B = Math.round(0.01 * fs), seg = { probe: [], cue: [], gap: [], all: [] };
  const Dseg = best >= 0.15 ? D : 0; // without a match the delay is unknown; assume a short one

// Measure the cue bleed (once more if other sound got in the way) and set up cancelling.

async function startSession() {
  busy = true;
  const btn = $('sesBtn');
  btn.disabled = true;
  try {
    setStatus('Allow microphone access if asked…');
    const cap = await openCapture();
    setStatus('Listening to the room. Stay quiet for 2 seconds…');
    const waitStart = Date.now();
    while (cap.V.state === 'cal') {
      await sleep(100);
      if (capture !== cap) throw new Error('stopped');
      if (Date.now() - waitStart > 6000) throw new Error('No sound is arriving from the microphone. Check the input device and try again');
    }
    if (!S.muted) {
      setStatus('You will hear a short hiss and the cue. Stay quiet while MICE learns how much of it reaches the microphone…');
      await measureBleed(cap);
      if (capture !== cap) throw new Error('stopped');
    } else {
      cap.bleed = null;
      $('bleedMsg').textContent = 'Cue bleed not measured, because the cue is muted.';
      $('envNote').hidden = true;
    }
    session = { cap };
    $('recBadge').classList.add('rec'); $('recBadge').textContent = 'Listening';
    btn.textContent = 'Stop listening'; btn.classList.remove('primary'); btn.classList.add('stop');
    setStatus('Listening. Hold the cue just before you speak; the Dynamic voice learns from your speech as you go.');
  } catch (err) {
    closeCapture();
    if (!(err && err.message === 'stopped')) micError(err);
  } finally {

}
async function stopSession() {
  const s = session;
  if (!s) return;
  releaseAll();
  const cap = s.cap;
  if (cap.segOpen != null) voiceOff(cap, capNow(cap));
  session = null;
  closeCapture();
  const btn = $('sesBtn');
  $('recBadge').classList.remove('rec'); $('recBadge').textContent = 'Mic off';
  btn.textContent = 'Start listening'; btn.classList.add('primary'); btn.classList.remove('stop');
  setStatus('Stopped. Nothing is saved.');
}
$('sesBtn').addEventListener('click', (e) => {
  e.currentTarget.blur();
  if (busy) return;
  if (session) stopSession(); else startSession();
});

// ---------------- match my voice ----------------
$('matchBtn').addEventListener('click', (e) => {
  e.currentTarget.blur();
  const cap = capture;
  if (!cap) { $('matchMsg').textContent = 'Start listening and say a few sentences first.'; return; }
  const f = [];
  for (let i = cap.fc - 1; i >= 0 && i > cap.fc - HN; i--) { const j = i % HN; if (cap.hist.f0[j] > 0 && cap.hist.v[j]) f.push(cap.hist.f0[j]); }
  if (f.length < 60) { $('matchMsg').textContent = 'Not enough speech yet. Say a few sentences, then try again.'; return; }
  const med = median(f);
  const m = Math.min(NOTE_HI, Math.max(NOTE_LO, Math.round(12 * Math.log2(med / 440) + 69)));
  $('note').value = String(m);
  setSetting('note', m);
  $('matchMsg').textContent = 'Your speaking pitch is about ' + Math.round(med) + ' Hz. Note set to ' + noteName(m) + '.';
});

// ---------------- timeline ----------------
let colors = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  ['ink', 'muted', 'line', 'cue', 'voice', 'voice-dim', 'surface', 'bg'].forEach((k) => { colors[k] = cs.getPropertyValue('--' + k).trim(); });
  colors.sans = cs.getPropertyValue('--sans').trim();
  colors.mono = cs.getPropertyValue('--mono').trim();
}
readColors();
if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', readColors); }
function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function draw() {
  requestAnimationFrame(draw);
  const cv = $('tl');

  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }

  g.strokeStyle = colors.line; g.lineWidth = 1;

  g.fillStyle = colors.muted;
  g.fillText('CUE', 2, cueY - 9);
  g.fillText('VOICE', 2, vTop - 9);
  g.textAlign = 'right'; g.fillText('now', W - 2, H - 4); g.textAlign = 'left'; g.fillText('8 s ago', 2, H - 4);
  for (const p of livePresses) {
    const b = X(p.up == null ? now : p.up);
    if (b < 0) continue;
    const a = Math.max(-6, X(p.down));
    g.fillStyle = colors.cue; rrect(g, a, cueY, Math.max(3, b - a), cueH, 4); g.fill();
  }
  const cap = capture;
  if (cap && cap.fc > 0) {
    const lo = cap.V.floor - 3, hi = cap.V.floor + 42;
    const bw = Math.max(1, (W / SPAN) * 0.01 + 0.3);
    for (let i = cap.fc - 1; i >= 0 && i > cap.fc - HN; i--) {
      const j = i % HN, t = cap.hist.t[j];
      if (t < now - SPAN - 0.02) break;
      const y = Math.max(0, Math.min(1, (cap.hist.db[j] - lo) / (hi - lo)));
      if (y <= 0) continue;
      g.fillStyle = cap.hist.v[j] ? colors.voice : colors['voice-dim'];
      g.fillRect(X(t) - bw / 2, vTop + vH - y * vH, bw, y * vH);

    g.fillStyle = colors.muted; g.textAlign = 'center'; g.font = '13px ' + colors.sans;

requestAnimationFrame(draw);

// ---------------- environment checks ----------------
(function envCheck() {

  if (!(window.AudioContext || window.webkitAudioContext)) problems.push('This browser cannot play sound here.');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) problems.push('This browser cannot use the microphone from this file. Open it in Chrome or Edge, over https or from disk.');
  if (problems.length) { $('envNote').hidden = false; $('envNote').textContent = problems.join(' '); }
})();
window.__mice = { get tune() { return tuneFor(); }, get prof() { return capture && capture.prof; }, get capture() { return capture; }, get segs() { return liveSegs; } };

// Collapsible panels: remembered per panel; closed by default on narrow screens so the pad stays in front.
['sesFold', 'cueFold'].forEach((id) => {
  const d = $(id);
  d.open = store.get('open.' + id, window.innerWidth > 920);
  d.addEventListener('toggle', () => store.set('open.' + id, d.open));
